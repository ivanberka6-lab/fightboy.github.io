<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚓ Морской бой — онлайн</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ЭКРАН 1: МЕНЮ -->
  <section id="screen-menu" class="screen active">
    <h1>⚓ Морской бой</h1>
    <p class="subtitle">Онлайн-битва на двоих</p>
    <div class="menu-box">
      <button id="btn-create" class="btn primary">🎮 Создать игру</button>
      <div class="divider">или</div>
      <input id="input-code" type="text" maxlength="6" placeholder="КОД КОМНАТЫ" autocomplete="off">
      <button id="btn-join" class="btn">🔗 Присоединиться</button>
    </div>
    <div id="room-info" class="room-info hidden">
      <div>Ваш код комнаты:</div>
      <div id="room-code-display" class="room-code">------</div>
      <div id="room-status" class="room-status">⏳ Ожидание соперника...</div>
      <button id="btn-copy" class="btn small">📋 Копировать код</button>
    </div>
  </section>

  <!-- ЭКРАН 2: РАССТАНОВКА -->
  <section id="screen-place" class="screen">
    <h2>🚢 Расстановка флота</h2>
    <div class="place-layout">
      <aside class="ship-list">
        <h3>Корабли</h3>
        <div id="ships-container"></div>
        <div class="place-controls">
          <button id="btn-rotate" class="btn small">🔄 Повернуть (R)</button>
          <button id="btn-random" class="btn small">🎲 Рандом</button>
          <button id="btn-undo" class="btn small">↩️ Отменить</button>
          <button id="btn-clear" class="btn small">🗑️ Очистить</button>
        </div>
        <button id="btn-ready" class="btn primary" disabled>✅ Готов</button>
        <div id="place-status" class="place-status"></div>
      </aside>
      <div class="boards">
        <div class="board-wrap">
          <h3>Ваше поле</h3>
          <div id="board-own" class="board"></div>
        </div>
        <div class="board-wrap preview">
          <h3>Превью</h3>
          <div id="board-preview" class="board"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 3: БОЙ -->
  <section id="screen-battle" class="screen">
    <h2>⚔️ Бой</h2>
    <div id="turn-indicator" class="turn-indicator">Ваш ход</div>
    <div class="battle-layout">
      <div class="board-wrap">
        <h3>Поле соперника</h3>
        <div id="board-enemy" class="board enemy"></div>
      </div>
      <div class="board-wrap">
        <h3>Ваше поле</h3>
        <div id="board-self" class="board"></div>
      </div>
    </div>
    <div class="log-wrap">
      <h3>Лог боя</h3>
      <div id="battle-log" class="battle-log"></div>
    </div>
  </section>

  <!-- ЭКРАН 4: ФИНАЛ -->
  <section id="screen-result" class="screen">
    <div id="result-content" class="result-content">
      <h1 id="result-title">Победа!</h1>
      <p id="result-text"></p>
      <button id="btn-again" class="btn primary">🔄 Играть снова</button>
      <button id="btn-exit" class="btn">🏠 В меню</button>
    </div>
  </section>

</div>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="script.js"></script>
</body>
</html>
